# Review the current Render price before creating this paid service + disk.
services:
  - type: web
    name: pebble-hood
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: umask 077 && uvicorn backend.app:create_app --factory --host 0.0.0.0 --port "$PORT" --workers 1 --no-access-log
    healthCheckPath: /health
    disk:
      name: hood-private-data
      mountPath: /var/data/hood
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: HOOD_DATA_DIR
        value: /var/data/hood
      - key: HOOD_VAULT_SECRET
        generateValue: true
